[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/Vilguax/verdigris"

[workspace.dependencies]
verdigris-protocol = { path = "crates/verdigris-protocol" }
verdigris-worldgen = { path = "crates/verdigris-worldgen" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.verdigris-worldgen]
opt-level = 3

[profile.dev.package.verdigris-protocol]
opt-level = 3
